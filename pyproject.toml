[project]
name = "leetcodebot-analysis"
version = "0.1.0"
description = "Offline analysis for LeetCodeBot"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-re2>=1.1.20251105",
    "markdownify>=1.2.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
]

[tool.ruff]
line-length = 88

[dependency-groups]
dev = [
    "jupyterlab>=4.6.4",
]
